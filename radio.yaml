# ═══════════════════════════════════════════════════════════
#  Radio
#  Internet Radio | MQTT | Home Assistant
#  Board: Sunton ESP32-2432S024R (CYD, 2.4" ILI9341 + XPT2046)
# ═══════════════════════════════════════════════════════════

substitutions:
  project_name: radio
  author_name: carsten-walther
  friendly_name: Radio
  comment: Internet Radio
  version: 2026.8.27
  area: Miscellaneous

  #
  # The on-board amplifier's input. GPIO26 is DAC channel 1 - fixed in
  # silicon; the only other DAC pin is GPIO25 (channel 0).
  #
  # ESPHome's own i2s_audio speaker refuses the internal DAC outright
  # ("Internal DAC is no longer supported", a hard error), because the IDF 5
  # I2S driver dropped its built-in DAC mode. The silicon did not go anywhere:
  # IDF 5 replaced that mode with a dedicated DMA driver, dac_continuous, and
  # the local dac_speaker component in components/ wraps exactly that driver
  # in the ordinary Speaker interface. So this pin drives the speaker the
  # board was built around, no extra hardware, at the DAC's native 8 bits.
  #
  PIN_SPEAKER: GPIO26

#
# https://esphome.io/components/external_components
#
# The dac_speaker platform lives in components/ - see the note at PIN_SPEAKER.
#
external_components:
  - source:
      type: local
      path: components

#
# https://esphome.io/components/esphome
#
esphome:
  name: "${project_name}"
  friendly_name: "${friendly_name}"
  comment: "${comment}"
  area: "${area}"
  min_version: 2026.2.0
  project:
    name: "${author_name}.${project_name}"
    version: "${version}"

  #
  # Put the restored station's name on the panel. play: false - coming back
  # from a power cut should not start making noise on its own.
  #
  # Priority -100 so it runs after everything is up; lvgl is a component like
  # any other and lbl_station_name has to exist before a label call reaches it.
  #
  on_boot:
    - priority: -100
      then:
        - script.execute:
            id: station_apply
            play: false

#
# https://esphome.io/components/esp32
#
esp32:
  board: esp32dev
  cpu_frequency: 240MHZ
  framework:
    type: esp-idf

    #
    # THIS IS WHAT CAUSED "Decoder encountered an error: ESP_ERR_NO_MEM"
    # and, one attempt later, "MP3 decoder failed: -2".
    #
    # Both are the same failure. -2 is micro_mp3::MP3_ALLOCATION_FAILED, and
    # the NO_MEM is AudioDecoder::start() finding its 4kB transfer buffer was
    # never allocated. Neither says anything about the stream: the heap simply
    # had nothing left to give when play was pressed.
    #
    # What took it is ESPHome, not this config. speaker/media_player calls
    # network.require_high_performance_networking(), and wifi/__init__.py and
    # network/__init__.py answer it with a profile written for boards that have
    # PSRAM - applied here unconditionally, because "PSRAM not guaranteed"
    # still means "apply the optimized settings", only slightly smaller ones.
    # Read them out of the generated sdkconfig.radio and they are:
    #
    #   CONFIG_ESP_WIFI_STATIC_RX_BUFFER_NUM=16   (IDF default 10)
    #   CONFIG_ESP_WIFI_DYNAMIC_RX_BUFFER_NUM=64  (IDF default 32)
    #   CONFIG_ESP_WIFI_DYNAMIC_TX_BUFFER_NUM=64  (IDF default 32)
    #   CONFIG_ESP_WIFI_RX_BA_WIN=32              (IDF default 6)
    #   CONFIG_ESP_WIFI_TX_BA_WIN=32              (IDF default 6)
    #   CONFIG_LWIP_TCP_WND_DEFAULT=65534         (IDF default 5744)
    #   CONFIG_LWIP_TCP_SND_BUF_DEFAULT=65534     (IDF default 5744)
    #
    # The static RX buffers alone are 16 x 1600B = 25kB of DRAM held forever.
    # The 64kB TCP window is worse, because it is PER SOCKET: lwIP will queue
    # up to 64kB of received segments in the heap for the audio stream, and
    # again for the Home Assistant connection, and there are twelve sockets.
    # A radio stream pulling flat out is exactly the workload that fills it.
    # That is why the failure needs Home Assistant to be connected and a
    # stream to be running before it shows up.
    #
    # These values are set from the components' own to_code (wifi at priority
    # COMMUNICATION=60, network at NETWORK=201), and sdkconfig_options here is
    # applied by the esp32 component at priority COMPONENT=0 - last, so it
    # wins. That ordering is the only reason this block works at all.
    #
    # Back to roughly IDF defaults. 192kbit/s is 24kB/s; none of these numbers
    # is anywhere near the limiting factor for that, and the ~40kB they give
    # back is what the decoder needs.
    #
    sdkconfig_options:
      CONFIG_ESP_WIFI_STATIC_RX_BUFFER_NUM: "8"
      CONFIG_ESP_WIFI_DYNAMIC_RX_BUFFER_NUM: "16"
      CONFIG_ESP_WIFI_DYNAMIC_TX_BUFFER_NUM: "16"
      CONFIG_ESP_WIFI_RX_BA_WIN: "6"
      CONFIG_ESP_WIFI_TX_BA_WIN: "6"

      # 8 x MSS(1440). Keep it a multiple of the MSS - lwIP rounds down, and a
      # window that is not a whole number of segments only wastes the tail.
      CONFIG_LWIP_TCP_WND_DEFAULT: "11520"
      CONFIG_LWIP_TCP_SND_BUF_DEFAULT: "5760"
      CONFIG_LWIP_TCP_RECVMBOX_SIZE: "16"
      CONFIG_LWIP_TCPIP_RECVMBOX_SIZE: "32"

      # The stations below are plain http, so nothing routine goes through
      # mbedTLS any more - but Home Assistant can still hand this player an
      # https URL, and a TLS session with a 16kB input record buffer is another
      # ~20kB on top of the handshake. DYNAMIC_BUFFER releases those buffers
      # between records instead of holding them for the life of the socket.
      CONFIG_MBEDTLS_DYNAMIC_BUFFER: "y"

    advanced:
      # +40kB of RAM, and the boot log asks for it by name ("Bootloader
      # supports SRAM1 as IRAM"). SRAM1 is normally left to the bootloader;
      # handing it to IRAM frees the equivalent amount of DRAM for the heap,
      # which on this device is the whole problem - the audio pipeline was
      # aborting on allocations with 148kB free at rest.
      sram1_as_iram: true

      # This board reports rev3.1 at boot and the log suggests it: telling the
      # build so drops the compatibility code for older silicon. Flash only,
      # no effect on RAM - but free.
      minimum_chip_revision: "3.1"


#
# https://esphome.io/components/esphome#preferences
#
preferences:
  flash_write_interval: 5min

#
# https://esphome.io/components/wifi
#
wifi:
  id: wifi_id
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  domain: .local
  fast_connect: false
  power_save_mode: NONE
  enable_on_boot: true
  output_power: 20dB
  ap:
    ssid: "${project_name}"
    password: !secret wifi_ap_password

  #
  # The other half of lbl_ip. There is no on_connect counterpart here on
  # purpose - the wifi_info text_sensor already covers arriving, and it does it
  # better, because it fires on the IP rather than on the association.
  #
  # This is needed because nothing else covers LEAVING. On esp-idf the IP state
  # listeners are notified from IP_EVENT_STA_GOT_IP only
  # (wifi_component_esp_idf.cpp), so a dropped link never publishes anything and
  # the panel would keep showing an address the device no longer has.
  #
  on_disconnect:
    then:
      - lvgl.label.update:
          id: lbl_ip
          text: "---.---.---.---"
      - lvgl.widget.update:
          id: lbl_connected
          text_color: 0x444444

#
# https://esphome.io/components/captive_portal
#
captive_portal:

#
# https://esphome.io/components/ota
#
ota:
  - platform: esphome
    password: !secret ota_password

#
# https://esphome.io/components/api
#
api:
  encryption:
    key: !secret api_encryption_key
  reboot_timeout: 0s

#
# https://esphome.io/components/mqtt
#
#mqtt:
#  id: mqtt_client_id
#  broker: !secret mqtt_broker
#  username: !secret mqtt_username
#  password: !secret mqtt_password
#  reboot_timeout: 0s
#  enable_on_boot: false
#  discovery: false
#  keepalive: 60s

#
# https://esphome.io/components/web_server
#
#web_server:
#  port: 80
#  version: 3
#  auth:
#    type: digest
#    username: !secret web_username
#    password: !secret web_password

#
# https://esphome.io/components/logger
#
logger:
  level: ERROR

#
# https://esphome.io/components/time/sntp
#
#
# Two sources, and NO selection logic between them - because there is nothing
# to select. Both platforms call RealTimeClock::synchronize_epoch_(), which
# sets the one system clock; now() on either id reads that same clock back.
# Whichever syncs first sets it, and the other agrees or is ignored (a sync
# within +/-1s of the current time is skipped as a no-op).
#
# So "Home Assistant, otherwise SNTP" needs no code: with no API connection
# SNTP sets the clock, with no internet route Home Assistant does, and with
# both the first one wins and the second changes nothing.
#
# The consequence worth knowing: the minute tick below sits on sntp_time but
# does NOT depend on SNTP having worked. A cron trigger reads the system
# clock, so it keeps ticking on a Home-Assistant-only clock just the same.
#
time:
  - platform: homeassistant
    id: homeassistant_time
    # Pinned deliberately, and NOT left to Home Assistant.
    #
    # Without this line ESPHome defines USE_HOMEASSISTANT_TIMEZONE, and HA
    # pushes its own zone on every connect (api_connection.cpp calls
    # set_timezone). That is a GLOBAL setting - apply_timezone_ writes
    # set_global_tz - so it would overwrite the Europe/Berlin below and the
    # panel would show a different time depending on whether HA happened to be
    # connected. A clock has to read the same either way.
    #
    # Drop this line if HA should be authoritative for the zone; then keep the
    # two in step by hand.
    timezone: Europe/Berlin
    on_time_sync:
      then:
        - script.execute: clock_show

  - platform: sntp
    id: sntp_time
    timezone: Europe/Berlin
    on_time_sync:
      then:
        - script.execute: clock_show

    # The ongoing tick, on one platform only - two would fire twice a minute
    # for one visible change.
    on_time:
      - seconds: 0
        then:
          - script.execute: clock_show

# ═══════════════════════════════════════════════════════════
#  CYD (ESP32-2432S024R)
#  Pins taken from the Sunton board definition:
#  TFT   ILI9341  SCLK 14 / MOSI 13 / MISO 12 / CS 15 / DC 2, no reset
#  Touch XPT2046  same bus, CS 33, IRQ 36
#  Backlight 27, RGB LED 4/16/17 (active low), LDR 34, speaker amp 26
#  SD card on its own bus: CS 5 / MOSI 23 / SCLK 18 / MISO 19
# ═══════════════════════════════════════════════════════════

#
# https://esphome.io/components/spi
#
spi:
  - id: spi_bus
    clk_pin: GPIO14
    mosi_pin: GPIO13
    miso_pin:
      number: GPIO12
      ignore_strapping_warning: true

#
# https://esphome.io/components/globals
#
globals:
  #
  # THE STATION LIST. One entry per line, "Name|URL".
  #
  # One vector of joined strings rather than two parallel vectors of names and
  # URLs. Parallel lists are the classic way to get a station playing under
  # another station's name: nothing structurally stops them drifting out of
  # step, and the index that reads them cannot tell. Here the pairing cannot
  # come apart, and adding a station is one line.
  #
  # It lives here rather than in substitutions: because a substitution can only
  # hold a string - see the note up there.
  #
  # http, not https, and deliberately. All five hosts answer on plain http and
  # redirect to a plain-http streamabc endpoint, which the audio reader follows
  # (esp_http_client, disable_auto_redirect=false). Over https the same play
  # costs a TLS session for the redirect AND one for the stream - tens of kB of
  # mbedTLS heap at exactly the moment the MP3 decoder wants its ~30kB, on a
  # board with no PSRAM. The seven-second gap between ANNOUNCING and the ring
  # buffer in the log was that handshake.
  #
  # It also makes the station list agree with icy_info, which is http-only for
  # the same reason - see the header of that component.
  #
  # Nothing here is worth encrypting: these are public streams, and the URLs
  # are in the firmware image anyway.
  - id: stations
    type: std::vector<std::string>
    restore_value: no
    initial_value: |-
      {
        "Klassik Radio|http://live.streams.klassikradio.de/klassikradio-deutschland/stream/mp3",
        "Toggo Radio|http://radio.toggo.de/live/mp3-128/airable",
        "BEATS Radio|http://stream.klassikradio.de/beats/mp3",
        "80s80s|http://streams.80s80s.de/web/mp3-192/streams.80s80s.de/",
        "90s90s|http://streams.90s90s.de/90s00s/mp3-192/streams.90s90s.de/"
      }

  #
  # Which of them is selected. Restored, so the radio comes back on the station
  # it was left on; station_apply wraps it into range on every use, so a stored
  # index that outlived its station cannot point past the end.
  #
  - id: station_index
    type: int
    restore_value: yes
    initial_value: '0'

#
# https://esphome.io/components/script
#
script:
  #
  # Puts the clock on the panel. Called from both time sources' on_time_sync -
  # so the display fills the moment ANY source lands, rather than at the next
  # full minute - and from the minute tick after that.
  #
  # now() is read from sntp_time, but that is not a preference: both platforms
  # share the system clock, so either id returns the same value. It matters
  # only if that id ever disappears from this file.
  #
  # The is_valid() guard is what keeps the placeholders honest. Callbacks also
  # fire on a sync that changed nothing, and on_time_sync can arrive before
  # the epoch is plausible; without it the labels would briefly show 1970.
  #
  - id: clock_show
    mode: single
    then:
      - if:
          condition:
            lambda: 'return id(sntp_time).now().is_valid();'
          then:
            - lvgl.label.update:
                id: lbl_time
                text: !lambda 'return id(sntp_time).now().strftime("%H:%M");'
            - lvgl.label.update:
                id: lbl_date
                text: !lambda 'return id(sntp_time).now().strftime("%d.%m.%Y");'

  #
  # The one place the station list is read.
  #
  # Every button goes through here rather than reaching into the list itself,
  # so the wrap-around, the name/URL split and the label update exist once.
  #
  # `play` says whether to start the stream as well as show it. Stepping with
  # btn_back/btn_next passes whatever is already running, so browsing while
  # stopped stays stopped and browsing while playing switches station without
  # a stop in between.
  #
  - id: station_apply
    mode: restart
    parameters:
      play: bool
    then:
      - lambda: |-
          const auto &list = id(stations);
          if (list.empty()) {
            return;
          }

          const int count = (int) list.size();
          // Wrapped here and nowhere else, so the buttons can just add or
          // subtract 1 and a restored index is bounded even if the list shrank.
          const int index = ((id(station_index) % count) + count) % count;
          id(station_index) = index;

          const std::string &entry = list[index];
          const size_t sep = entry.find('|');
          const std::string name = entry.substr(0, sep);
          const std::string url = (sep == std::string::npos) ? std::string() : entry.substr(sep + 1);

          lv_label_set_text(id(lbl_station_name), name.c_str());

          if (play && !url.empty()) {
            // set_media_url alone. Adding a PLAY command on top logged
            // "Setting both command and media_url is not needed" on every
            // station change - MediaPlayerCall::validate_() drops the command
            // itself, because a URL already means play.
            id(radio_player)->make_call().set_media_url(url).perform();
            // Point the metadata poller at the same stream, and poll now
            // rather than in up to 30s - a station change whose title lags
            // half a minute looks like the wrong title, not a slow one.
            id(icy_id)->set_url(url);
            id(icy_id)->request_now();
          }

#
# The local dac_speaker platform - the on-board amplifier via the internal
# DAC. See the note at PIN_SPEAKER for why this is a local component.
#
# The pipeline still decodes to 16-bit mono; the cut to the DAC's 8 bits and
# the software volume happen in the speaker task, one pass per chunk.
#
speaker:
  - platform: dac_speaker
    id: radio_speaker
    pin: ${PIN_SPEAKER}

    # 50ms. The buffer holds INPUT-format audio, and the pipeline delivers
    # stereo (it has no resampler, so the mono the speaker asks for is a
    # preference nobody acts on) - 50ms at 44100Hz stereo 16-bit is 8820
    # bytes, where 100ms was 17640.
    #
    # Small on purpose: the media_player's 16kB buffer upstream does the real
    # smoothing, this one only has to outlast a scheduling hiccup.
    buffer_duration: 50ms

#
# https://esphome.io/components/media_player/speaker
#
# Only announcement_pipeline, and that is a supported arrangement rather than
# a shortcut: the schema requires it, the media pipeline is optional, and the
# two cannot share one speaker without the mixer component. With only this one
# defined the player runs in single-pipeline mode - every command path checks
# single_pipeline_() and routes here, so ordinary playback works.
#
# format: MP3 is what pulls in the decoder, and it is what costs the flash:
# 76.4% -> 85.5% measured on this config.
#
# TWO ENTRIES, ONE RADIO. This one owns the audio and is internal:; the
# radio_proxy below it is what Home Assistant sees. See components/radio_proxy/
# for why - in short, the stream URL exists only inside the MediaPlayerCall
# that carries it, and nothing but the player receiving that call can read it.
#
media_player:
  - platform: speaker
    id: radio_player
    name: Radio Engine
    internal: true
    volume_initial: 50%

    #
    # THIS IS WHAT CAUSED "Media reader encountered an error: ESP_ERR_NO_MEM".
    #
    # The default is 1000000 - one megabyte - and it is allocated as a single
    # ring buffer (audio_pipeline.cpp: RingBuffer::create(buffer_size_)) inside
    # the reader task, which is why the failure is reported against the reader.
    # An ESP32 without PSRAM has roughly 320kB of DRAM in total, so that
    # allocation cannot ever succeed here. The default is written for boards
    # that have PSRAM.
    #
    # 16kB, down from 32kB. Measured on the device: 148kB free at rest, under
    # 11kB while playing - so everything downstream of this was failing to
    # allocate, including the speaker task and the metadata poller's HTTP
    # client.
    #
    # The line is worth four times what it names. It also sets the transfer
    # buffers, min(buffer_size / 4, 24kB) each, allocated three times over -
    # once in the reader, twice in the decoder. At 32kB that was 32 + 3x8 =
    # 56kB; at 16kB it is 16 + 3x4 = 28kB.
    #
    # The cost is buffer depth: about one second of a 128kbit/s stream instead
    # of two. Raise it again if playback stutters on a weak signal, and watch
    # Heap Free while you do.
    #
    buffer_size: 16384

    # Both signals follow the PLAYER, not the button that was pressed: a
    # stream that dies, or a stop sent from Home Assistant, has to move them
    # too - and would not if the click handler flipped them.
    #
    # The glyph swap only became possible when the buttonmatrix became real
    # button widgets. A buttonmatrix button is a pseudo-widget with an empty
    # modify schema and no label of its own, so lvgl.widget.update rejected
    # `text` outright; a real button holds a real label, and that label has an
    # id.
    #
    # The checked state stays alongside it. It is not redundant - the glyph
    # says what the next press will do, the colour says what is happening now,
    # and on a panel this size the colour reads from across the room.
    #
    # BOTH on_play and on_announcement, and on_announcement is the one that
    # actually fires here. With only an announcement_pipeline the player runs
    # in single-pipeline mode and reports MEDIA_PLAYER_STATE_ANNOUNCING, never
    # PLAYING - so an icon hung on on_play alone never changed. on_play is kept
    # for the day a media_pipeline is added.
    #
    on_play:
      - lvgl.label.update:
          id: lbl_play_stop
          text: "\uF04D"
    on_announcement:
      - lvgl.label.update:
          id: lbl_play_stop
          text: "\uF04D"
    on_idle:
      - lvgl.label.update:
          id: lbl_play_stop
          text: "\uF04B"
      # Stop polling and clear title and bitrate - a silent radio showing a
      # song name claims something that is not happening.
      - lambda: 'id(icy_id)->set_url("");'
    announcement_pipeline:
      speaker: radio_speaker
      format: MP3
      sample_rate: 44100
      num_channels: 1

  #
  # The entity Home Assistant sees. It plays nothing: every command is copied
  # onto radio_player above and performed there, and this player's state,
  # volume and mute are read back from it - so there is one radio, with one
  # state, under one name.
  #
  # What it adds is on_media_url. A URL sent from Home Assistant used to
  # reach the pipeline and nothing else: icy_info was never told about it, so
  # the panel kept the station name of whatever the buttons last selected and
  # showed no title and no bitrate at all. Now the same three labels fill for
  # an outside stream as for one off the list.
  #
  # It fires ONLY for commands from outside. station_apply and the buttons
  # address radio_player directly and set the poller themselves, so nothing
  # here runs twice.
  #
  - platform: radio_proxy
    id: radio_proxy_player
    name: Radio
    target: radio_player
    on_media_url:
      then:
        # Point the poller at the stream and ask it to look now. Same pair as
        # in station_apply, and the same reason: request_now() stands back a
        # few seconds so the metadata connection does not compete with the
        # pipeline's allocations.
        - lambda: |-
            id(icy_id)->set_url(x);
            id(icy_id)->request_now();

        # Something in the station line immediately, rather than the previous
        # station's name for the seconds until icy-name arrives - and rather
        # than a blank, because an https URL has no ICY poll at all and would
        # leave it blank for good.
        #
        # The host is what a URL can be asked for honestly. It is not the
        # station's name and does not pretend to be one; icy_name replaces it
        # as soon as the poller has the real thing.
        - lvgl.label.update:
            id: lbl_station_name
            text: !lambda |-
              size_t start = x.find("://");
              start = (start == std::string::npos) ? 0 : start + 3;
              size_t end = x.find('/', start);
              std::string host = (end == std::string::npos) ? x.substr(start)
                                                            : x.substr(start, end - start);
              // user:pass@ and :port are part of the URL, not of the name.
              size_t at = host.rfind('@');
              if (at != std::string::npos) {
                host.erase(0, at + 1);
              }
              size_t colon = host.rfind(':');
              if (colon != std::string::npos) {
                host.erase(colon);
              }
              return host;

#
# Stream title and bitrate, from the ICY metadata the audio reader never asks
# for - a local component, components/icy_info/. It opens its own short-lived
# http connection every 30s, reads one metadata interval and hangs up; see the
# header of that component for the trade-offs (and why https is skipped).
#
# The sensors are internal: they exist to feed the two labels. Clearing
# publishes "" and NAN, which is why both lambdas guard before formatting.
#
icy_info:
  id: icy_id
  update_interval: 10s
  # The station's own name, from the icy-name header. It overwrites the name
  # from the stations list as soon as it arrives.
  #
  # The list name is not redundant: it is on the panel instantly and on every
  # station, including while stopped and while browsing with btn_back/btn_next,
  # where no stream is open to ask. This replaces it with the authoritative one
  # a second or two later.
  station_name:
    id: icy_name
    internal: True
    on_value:
      then:
        - lvgl.label.update:
            id: lbl_station_name
            text: !lambda 'return x;'

  stream_title:
    id: icy_title
    internal: True
    on_value:
      then:
        - lvgl.label.update:
            id: lbl_stream_title
            text: !lambda 'return x;'
  bitrate:
    id: icy_bitrate
    internal: True
    on_value:
      then:
        - lvgl.label.update:
            id: lbl_bitrate
            text: !lambda |-
              if (std::isnan(x) || x <= 0.0f) {
                return std::string("");
              }
              return str_sprintf("%.0f kbit/s", x);

#
# https://esphome.io/components/output
#
output:
  - id: backlight_pwm
    platform: ledc
    pin: GPIO27
  - id: led_r
    platform: ledc
    pin:
      number: GPIO4
      inverted: true
  - id: led_g
    platform: ledc
    pin:
      number: GPIO17
      inverted: true
  - id: led_b
    platform: ledc
    pin:
      number: GPIO16
      inverted: true

#
# https://esphome.io/components/light
#
light:
  - id: backlight
    platform: monochromatic
    output: backlight_pwm
    name: Display Backlight
    internal: true
    restore_mode: ALWAYS_ON
  - id: status_rgb
    platform: rgb
    name: Status LED
    internal: true
    red: led_r
    green: led_g
    blue: led_b
    restore_mode: ALWAYS_OFF

#
# https://esphome.io/components/text_sensor/wifi_info
#
# The source for lbl_ip, and internal because it exists to feed the panel
# rather than to be an entity - drop that line to have it in Home Assistant
# too.
#
# This platform rather than a wifi: on_connect lambda, and the difference
# matters: IPAddressWiFiInfo is a WiFiIPStateListener, so it fires when the
# IP actually arrives. on_connect fires on association, which is before DHCP
# has answered - reading the address there gets 0.0.0.0 often enough to look
# like a race that comes and goes.
#
# It also fires again by itself when the lease changes or the device moves to
# another access point, which a one-shot on_connect would miss.
#
text_sensor:
  - platform: wifi_info
    ip_address:
      id: wifi_ip
      internal: true
      on_value:
        then:
          - lvgl.label.update:
              id: lbl_ip
              # An unset address stringifies to 0.0.0.0, which is what this
              # publishes while the radio is down or associated but not yet
              # leased. Showing that as if it were an address would be a lie;
              # the placeholder says "no network" without pretending.
              text: !lambda |-
                return (x.empty() || x == "0.0.0.0") ? "---.---.---.---" : x;

          # The icon rides the same event as the address, and reads the same
          # way: white once there is a usable connection, dim otherwise.
          # Driving both from one event is what keeps them from disagreeing -
          # an icon claiming "connected" beside a row of dashes would be worse
          # than no icon at all.
          #
          # "Connected" here means LEASED, not associated: this fires on
          # IP_EVENT_STA_GOT_IP. An access point that answers but hands out no
          # address leaves the icon dim, which is the honest reading - nothing
          # on this device works without an address.
          - lvgl.widget.update:
              id: lbl_connected
              # lv_color_hex(), not a bare 0x...: a literal in the YAML is
              # converted by the code generator, but a lambda has to hand back
              # an lv_color_t itself ("could not convert 'int' to
              # 'lv_color_t'").
              text_color: !lambda |-
                return lv_color_hex((x.empty() || x == "0.0.0.0") ? 0x444444 : 0xFFFFFF);

#
# https://esphome.io/components/sensor
#
sensor:
  #
  # The two numbers that decide whether a stream can start.
  #
  # Worth having permanently on a board with no PSRAM: the audio pipeline
  # allocates a 32kB ring buffer plus three transfer buffers the moment play is
  # pressed, and if the heap cannot serve them the only symptom is
  # "Media reader encountered an error: ESP_ERR_NO_MEM" in the log.
  #
  # Read them together. Free can look healthy while the largest contiguous
  # block is far smaller - that is fragmentation, and a ring buffer needs one
  # contiguous run. The web server is what fragments a heap here: it allocates
  # per request and holds an open event stream per client.
  #
  - platform: template
    name: "Heap Free"
    entity_category: diagnostic
    unit_of_measurement: "B"
    accuracy_decimals: 0
    state_class: measurement
    icon: mdi:memory
    update_interval: 60s
    lambda: 'return (float) esp_get_free_heap_size();'

  - platform: template
    name: "Heap Largest Block"
    entity_category: diagnostic
    unit_of_measurement: "B"
    accuracy_decimals: 0
    state_class: measurement
    icon: mdi:memory
    update_interval: 60s
    lambda: 'return (float) heap_caps_get_largest_free_block(MALLOC_CAP_DEFAULT);'

  - platform: adc
    pin: GPIO34
    name: Ambient Light
    internal: true
    id: ambient_light
    attenuation: 12db
    update_interval: 30s

#
# NO media_source: BLOCK, and that is not an omission.
#
# There was one here (platform: audio_http), on the assumption that it served
# playback started from Home Assistant. It served nothing. media_source
# instances are consumed by exactly one thing: the newer speaker_source
# media_player, through the sources: list of one of its pipelines
# (speaker_source/media_player.py, CONF_SOURCES). The speaker media_player
# used above does not include media_source.h at all - it reads URLs itself,
# via its own AudioPipeline.
#
# Home Assistant never sends a media-source:// URI either; it resolves those
# on its side and hands over a plain http(s) URL, which is what radio_proxy
# now catches on the way past.
#
# Bring the block back only together with a move to platform: speaker_source -
# and then re-measure the buffers, because that path decodes through
# micro_decoder rather than the pipeline the numbers above were fitted to.
#

#
# https://esphome.io/components/display
#
display:
  - platform: mipi_spi
    id: esp_display

    #
    # ESPHome has NO model for the S024. The whole list is ESP32-2432S028
    # (ILI9341), ESP32-2432S028-7789 (ST7789V), ESP32-2432S028-9342 (ILI9342)
    # and ESP32-2424S012 (GC9A01A) - so this borrows a 2.8" board's model.
    # That is fine for the pins, which are identical (CS 15, DC 2, 40MHz);
    # only the controller is in question.
    #
    # It was ESP32-2432S028, i.e. the ILI9341 init sequence, and the panel
    # showed nothing but stripes. Stripes are what a controller does when it
    # did not accept the init sequence - and the sequence reaching it is
    # well-formed: a software reset IS emitted (no reset_pin means SWRESET
    # plus a 10ms settling delay), the config resolves, the build is clean.
    # So what arrives is correct and simply not what this panel speaks.
    #
    # The 2.4" boards are commonly ST7789 where the micro-USB 2.8" is ILI9341.
    # If this is still striped, try ESP32-2432S028-9342, and after that drop
    # data_rate to 10MHz - a bus too fast for the wiring corrupts pixel data
    # the same way. Rotation and mirroring cannot cause stripes and are not
    # worth changing while the panel is in this state.
    #
    model: ESP32-2432S028-7789
    spi_id: spi_bus
    cs_pin:
      number: GPIO15
      ignore_strapping_warning: true
    dc_pin:
      number: GPIO2
      ignore_strapping_warning: true
    data_rate: 40MHz
    color_order: BGR
    invert_colors: false
    auto_clear_enabled: false
    update_interval: never
    dimensions:
      width: 320
      height: 240
    transform:
      swap_xy: true
      mirror_x: true
      mirror_y: false

#
# https://esphome.io/components/touchscreen
#
touchscreen:
  platform: xpt2046
  id: esp_touch
  spi_id: spi_bus
  cs_pin: GPIO33
  # Boot log shows "gpio_pullup_en(85): GPIO number error (input-only pad has
  # no internal PU)" for this pin, and it is HARMLESS. The xpt2046 driver
  # hardcodes an internal pull-up on its IRQ line (xpt2046.cpp: FLAG_PULLUP),
  # but GPIO34-39 physically have none - IDF refuses, logs, and everything
  # continues. The 85 is a line number in IDF's gpio.c, not a GPIO. The board
  # carries an external pull-up on T_IRQ, which is why touch works regardless
  # - the calibration below was measured through exactly this wiring.
  interrupt_pin: GPIO36
  data_rate: 2MHz
  update_interval: 50ms
  threshold: 400
  calibration:
    x_min: 270
    x_max: 3870
    y_min: 420
    y_max: 3790
  transform:
    swap_xy: false
    mirror_x: true
    mirror_y: true

#
# https://esphome.io/components/interval
#
# THE VU METER. It lives out here, not in the lvgl: block below, because that
# block is regenerated from the designer and everything in it is disposable -
# the four widgets are, this is not.
#
# What was there before was a meter widget with a needle parked at 50. Nothing
# ever wrote to it: there was no source for a level anywhere in the config,
# and a needle that never moves is decoration, not an instrument. The level
# now comes from the audio itself - dac_speaker sums the squares of the
# samples in the pass where it downmixes them and hands out the loudest chunk
# RMS per channel (see pop_level() there), so this reads what is actually
# going to the amplifier, per channel, before the volume knob.
#
# 100ms, and that is a considered rate rather than "fast enough". A VU meter
# integrates over 300ms by definition, so ten reads a second is already
# finer-grained than the instrument being imitated; going faster would only
# spend SPI time redrawing a 320x6 strip that nobody can read that quickly.
#
interval:
  - interval: 100ms
    id: vu_tick
    then:
      - lambda: |-
          //
          // dB, not linear. A linear bar spends nine tenths of its length on
          // the top 20dB and shows nothing at all for quiet passages; music
          // that sits at -20dBFS would never leave the first tenth. The
          // 48dB window below is what a small meter can usefully resolve.
          //
          static const float FLOOR_DB = -48.0f;

          // Attack instant, release rate-limited: the meter must be at the
          // peak on the tick it happens, and must not drop out from under it
          // between two beats. 25dB/s empties the scale in ~2s, which is the
          // ballistic a bar meter is normally given.
          static const float DECAY_DB = 2.5f;

          // The peak marker: sits still for 1.2s, then walks down at 6dB/s.
          // The hold is the point of it - it is what makes a transient
          // readable on a display refreshed ten times a second.
          static const float PEAK_DECAY_DB = 0.6f;
          static const uint8_t HOLD_TICKS = 12;

          static const int16_t MARKER_W = 3;

          //
          // State, as function-local statics rather than globals:. Nothing
          // outside this lambda reads it, none of it survives a reboot in any
          // useful sense, and five arrays in globals: would be five
          // components registered for values that are meaningless the moment
          // the music stops.
          //
          static float level_db[2] = {FLOOR_DB, FLOOR_DB};
          static float peak_db[2] = {FLOOR_DB, FLOOR_DB};
          static uint8_t hold[2] = {0, 0};
          static int last_value[2] = {-1, -1};
          static int last_x[2] = {-1, -1};

          lv_obj_t *bars[2] = {id(vu_left), id(vu_right)};
          lv_obj_t *marks[2] = {id(vu_left_peak), id(vu_right_peak)};

          for (uint8_t ch = 0; ch < 2; ch++) {
            // Reading clears the slot, so a silent stream really does report
            // silence rather than the last loud thing it heard.
            const float level = id(radio_speaker)->pop_level(ch);
            float db = (level <= 0.0f) ? FLOOR_DB : 20.0f * std::log10(level);
            db = std::max(FLOOR_DB, std::min(0.0f, db));

            if (db > level_db[ch]) {
              level_db[ch] = db;
            } else {
              level_db[ch] = std::max(db, level_db[ch] - DECAY_DB);
            }

            if (level_db[ch] >= peak_db[ch]) {
              peak_db[ch] = level_db[ch];
              hold[ch] = HOLD_TICKS;
            } else if (hold[ch] > 0) {
              hold[ch]--;
            } else {
              peak_db[ch] = std::max(level_db[ch], peak_db[ch] - PEAK_DECAY_DB);
            }

            const int value = (int) ((level_db[ch] - FLOOR_DB) / -FLOOR_DB * 1000.0f);
            if (value != last_value[ch]) {
              last_value[ch] = value;
              lv_bar_set_value(bars[ch], value, LV_ANIM_OFF);

              // Green until -12dBFS, amber to -3, red above it. The colour is
              // set on the indicator part, so the track behind stays dark
              // whatever the bar is doing.
              const uint32_t colour = level_db[ch] >= -3.0f    ? 0xD50000
                                      : level_db[ch] >= -12.0f ? 0xFFB300
                                                               : 0x00C853;
              lv_obj_set_style_bg_color(bars[ch], lv_color_hex(colour), LV_PART_INDICATOR);
            }

            //
            // The marker's position is READ OFF THE BAR, never assumed. Both
            // are children of the same container, so the bar's own x is the
            // offset the marker has to start from - and a bar that sits at
            // x=20 inside vu_meter is exactly what this got wrong before:
            // measuring from 0 put every marker 20px to the left of the bar
            // it belongs to.
            //
            // Reading it each tick also means the layout can be moved,
            // widened or turned in the designer without touching this lambda.
            //
            const int32_t bar_x = lv_obj_get_x(bars[ch]);
            const int32_t track = lv_obj_get_width(bars[ch]);

            // MARKER_W subtracted so the marker's RIGHT edge lands on the
            // fill's leading edge rather than its left one - otherwise it
            // reads as sitting a marker's width short of the level it marks.
            // Clamped to the bar, so silence parks it flush with the start
            // and full scale flush with the end.
            const float frac = (peak_db[ch] - FLOOR_DB) / -FLOOR_DB;
            int x = bar_x + (int) (frac * (float) track) - MARKER_W;
            x = std::max<int>(bar_x, std::min<int>(x, bar_x + track - MARKER_W));

            if (x != last_x[ch]) {
              last_x[ch] = x;
              lv_obj_set_x(marks[ch], x);
            }
          }

#
# https://esphome.io/components/lvgl
#

# >>> LVGL Designer - generated from the canvas. >>>
# This block is regenerated from the canvas - edits here are not preserved.
lvgl:
  # 10%, down from 25%. 25% of a 320x240 16-bit screen is 38kB held for the
  # lifetime of the device; 10% is 15kB, and the 23kB difference is most of
  # what the audio pipeline needed. LVGL just renders in more strips per
  # frame, which on a screen this static is not visible.
  buffer_size: 10%
  rotation: 90°
  theme:
    dark_mode: true
  pages:
    - id: canvas_splash
      bg_color: 0x000000
      pad_all: 0
      scrollable: false
      scrollbar_mode: "OFF"
      widgets:
        - label:
            id: lbl_station_name
            x: 0
            y: 50
            width: 100%
            text: "${project_name}"
            text_color: 0xFFFFFF
            text_align: CENTER
            long_mode: SCROLL
            text_font: montserrat_28

        - label:
            id: lbl_stream_title
            x: 0
            y: 90
            width: 100%
            text: "Version ${version}"
            text_color: 0xFFFFFF
            text_align: CENTER
            long_mode: SCROLL
            text_font: montserrat_20

    - id: canvas_main
      bg_color: 0x000000
      pad_all: 0
      scrollable: false
      scrollbar_mode: "OFF"
      widgets:
        - label:
            id: lbl_time
            x: 0
            y: 0
            align: TOP_LEFT
            text: "--:--"
            text_color: 0xFFFFFF
            text_font: montserrat_14

        - label:
            id: lbl_connected
            x: -20
            y: 0
            align: TOP_MID
            text: "\uF1EB"
            # Six hex digits, not seven - this read 0x4444444, which YAML
            # accepts as the integer 71581764 and LVGL then truncates to
            # something that is not the grey it looks like. Dim until the
            # network is actually up; see the wifi_info sensor.
            text_color: 0x444444
            text_font: montserrat_14

        - label:
            id: lbl_battery
            x: 20
            y: 0
            align: TOP_MID
            hidden: true
            text: "\uF244"
            text_color: 0xFFFFFF
            text_font: montserrat_14

        - label:
            id: lbl_date
            x: 0
            y: 0
            align: TOP_RIGHT
            text: "--.--.----"
            text_color: 0xFFFFFF
            text_font: montserrat_14

        - line:
            id: lv_line
            x: 0
            y: 18
            width: 100%
            height: 1
            points:
              - 0, 0
              - 100%, 0
            line_width: 1
            line_color: 0xB3B3B3

        - label:
            id: lbl_ip
            x: 0
            y: 20
            align: TOP_MID
            hidden: true
            text: "---.---.---.---"
            text_color: 0xFFFFFF
            text_font: montserrat_14

        - label:
            id: lbl_station_name
            x: 0
            y: 50
            width: 100%
            text: ""
            text_color: 0xFFFFFF
            text_align: CENTER
            long_mode: SCROLL
            text_font: montserrat_28

        - label:
            id: lbl_stream_title
            x: 0
            y: 90
            width: 100%
            text: ""
            text_color: 0xFFFFFF
            text_align: CENTER
            long_mode: SCROLL
            text_font: montserrat_20

        - label:
            id: lbl_bitrate
            x: 0
            y: 120
            width: 100%
            text: ""
            text_color: 0xFFFFFF
            text_align: CENTER
            long_mode: SCROLL
            text_font: montserrat_14
        
        # The VU meter: two bars in the band between lbl_bitrate (ends at
        # 138) and the button grid (starts at 160), and two peak markers
        # riding on top of them. Driven by the vu_tick interval further down -
        # see there for the ballistics and for why this is not a meter widget
        # any more.
        #
        # 0..1000 rather than 0..100: the bar is 320px wide, and on a
        # percentage scale every step of the value jumps three pixels, which
        # on a meter that moves continuously reads as stepping.
        - obj:
            id: vu_meter
            x: 0
            y: 175
            width: 240
            height: 50
            pad_all: 0
            bg_color: 0x555555
            widgets:
              - label:
                  id: vu_label_left
                  x: 5
                  y: 5
                  text: "L"
                  text_color: 0xFFFFFF
              - bar:
                  id: vu_left
                  x: 20
                  y: 10
                  width: 200
                  height: 6
                  value: 0
                  min_value: 0
                  max_value: 1000
                  animated: false
                  indicator:
                    bg_color: 0x00C853
                    radius: 0
                  bg_color: 0x141414
                  border_width: 0
                  radius: 0
                  pad_all: 0
                  bg_opa: 100%
              - obj:
                  id: vu_left_peak
                  x: 20
                  y: 10
                  width: 3
                  height: 6
                  bg_color: 0xFFFFFF
                  border_width: 0
                  radius: 0
                  pad_all: 0
                  scrollbar_mode: "OFF"

              - label:
                  id: vu_label_right
                  x: 5
                  y: 25
                  text: "R"
                  text_color: 0xFFFFFF
              - bar:
                  id: vu_right
                  x: 20
                  y: 30
                  width: 200
                  height: 6
                  value: 0
                  min_value: 0
                  max_value: 1000
                  animated: false
                  indicator:
                    bg_color: 0x00C853
                    radius: 0
                  bg_color: 0x141414
                  border_width: 0
                  radius: 0
                  pad_all: 0
                  bg_opa: 100%
              - obj:
                  id: vu_right_peak
                  x: 20
                  y: 30
                  width: 3
                  height: 6
                  bg_color: 0xFFFFFF
                  border_width: 0
                  radius: 0
                  pad_all: 0
                  scrollbar_mode: "OFF"

        - obj:
            id: lv_obj
            x: 0
            y: 0
            width: 100%
            height: 80
            align: BOTTOM_MID
            bg_opa: 0%
            border_width: 0
            border_opa: 0%
            scrollbar_mode: "OFF"
            pad_all: 0
            layout:
              type: GRID
              grid_rows: [FR(1), FR(1)]
              grid_columns: [FR(1), FR(1), FR(1)]
              grid_row_align: CENTER
              grid_column_align: CENTER
              pad_row: 2
              pad_column: 2
            widgets:
              # Step back a station. Keeps playing if it was playing, so
              # browsing switches stream rather than stopping first.
              - button:
                  id: btn_back
                  radius: 4
                  widgets:
                    - label:
                        align: CENTER
                        text: "\uF048"
                  grid_cell_row_pos: 0
                  grid_cell_column_pos: 0
                  grid_cell_x_align: STRETCH
                  grid_cell_y_align: STRETCH
                  on_click:
                    - lambda: 'id(station_index) -= 1;'
                    - script.execute:
                        id: station_apply
                        play: !lambda |-
                          const auto s = id(radio_player)->state;
                          return s == media_player::MEDIA_PLAYER_STATE_PLAYING ||
                                 s == media_player::MEDIA_PLAYER_STATE_ANNOUNCING;
              
              # Play the selected station, or stop what is running.
              #
              # The state is read from the player rather than kept in a
              # global: Home Assistant, the web interface and this button
              # all drive the same player, and a mirrored flag would be
              # wrong the moment one of the others acted.
              - button:
                  id: btn_play_stop
                  radius: 4
                  widgets:
                    # The id is what makes the glyph swappable - see the
                    # media_player's on_play/on_idle. It was not possible while
                    # this was a buttonmatrix: those buttons are pseudo-widgets
                    # with no label of their own to address.
                    - label:
                        id: lbl_play_stop
                        align: CENTER
                        text: "\uF04B"
                  grid_cell_row_pos: 0
                  grid_cell_column_pos: 1
                  grid_cell_x_align: STRETCH
                  grid_cell_y_align: STRETCH
                  on_click:
                    - if:
                        condition:
                          # ANNOUNCING as well as PLAYING - this player only
                          # has an announcement pipeline, so it reports
                          # ANNOUNCING while a station is running and this
                          # button did nothing but restart the stream while it
                          # only tested for PLAYING.
                          lambda: |-
                            const auto s = id(radio_player)->state;
                            return s == media_player::MEDIA_PLAYER_STATE_PLAYING ||
                                   s == media_player::MEDIA_PLAYER_STATE_ANNOUNCING;
                        then:
                          - media_player.stop:
                              id: radio_player
                        else:
                          - script.execute:
                              id: station_apply
                              play: true

              - button:
                  id: btn_next
                  radius: 4
                  widgets:
                    - label:
                        align: CENTER
                        text: "\uF051"
                  grid_cell_row_pos: 0
                  grid_cell_column_pos: 2
                  grid_cell_x_align: STRETCH
                  grid_cell_y_align: STRETCH
                  on_click:
                    - lambda: 'id(station_index) += 1;'
                    - script.execute:
                        id: station_apply
                        play: !lambda |-
                          const auto s = id(radio_player)->state;
                          return s == media_player::MEDIA_PLAYER_STATE_PLAYING ||
                                 s == media_player::MEDIA_PLAYER_STATE_ANNOUNCING;

              # Volume, in the media player's volume_increment steps. The
              # command lands in SpeakerMediaPlayer::set_volume_, which hands
              # it to the speaker - the dac_speaker applies it in software on
              # the next chunk, so it takes effect mid-playback.
              - button:
                  id: btn_vol_down
                  radius: 4
                  widgets:
                    - label:
                        align: CENTER
                        text: "\uF027"
                  grid_cell_row_pos: 1
                  grid_cell_column_pos: 0
                  grid_cell_x_align: STRETCH
                  grid_cell_y_align: STRETCH
                  on_click:
                    - media_player.volume_down:
                        id: radio_player

              - button:
                  id: btn_vol_up
                  radius: 4
                  widgets:
                    - label:
                        align: CENTER
                        text: "\uF028"
                  grid_cell_row_pos: 1
                  grid_cell_column_pos: 1
                  grid_cell_x_align: STRETCH
                  grid_cell_y_align: STRETCH
                  on_click:
                    - media_player.volume_up:
                        id: radio_player

              - button:
                  id: btn_settings
                  bg_color: 0x204EF3
                  radius: 4
                  widgets:
                    - label:
                        align: CENTER
                        text: "\uF013"
                  grid_cell_row_pos: 1
                  grid_cell_column_pos: 2
                  grid_cell_x_align: STRETCH
                  grid_cell_y_align: STRETCH

# <<< end LVGL Designer block <<<